name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Change to master if your default branch is master
  workflow_dispatch: # Allows you to trigger the build manually

# Set permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs time-buffered between the push and necessary execution time
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Optional: caches npm dependencies if a package.json exists

      - name: Install dependencies
        # Keeps build clean. If you don't use external npm packages, you can safely remove this step
        run: |
          if [ -f package.json ]; then
            npm ci
          fi

      - name: Run custom build script
        # Executes your custom build.js to generate the static files
        run: node build.js

      - name: Assemble site into dist
        run: |
          rsync -a ./ dist/ \
            --exclude dist --exclude .git --exclude .github --exclude node_modules \
            --exclude posts --exclude templates --exclude build.js \
            --exclude 'package*.json' --exclude README.md --exclude .gitignore

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
